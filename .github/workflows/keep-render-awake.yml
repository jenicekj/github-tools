name: Keep Render awake

on:
  schedule:
    # Every 10 minutes (GitHub can drift a few minutes)
    - cron: '*/10 * * * *'
  workflow_dispatch: # manual run from Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: |
          set -e
          URL="${{ vars.RENDER_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            URL="https://kniha-jizd-ppml.onrender.com/health"
          fi
          echo "GET $URL"
          curl -fsS --max-time 90 "$URL"
          echo
